[package]
name = "tapeti-decode"
version = "0.6.0"
description = "Tape recordings to TZX blocks for Tapeti"
license = "GPL-2.0-or-later"
edition = "2021"

[lib]
name = "tapeti_decode"
path = "src/lib.rs"
# The browser's one module: this crate's entry points and, through `tapeti-core`, the core's.
crate-type = ["cdylib", "rlib"]

[dependencies]
tapeti-core = { path = "../core" }
