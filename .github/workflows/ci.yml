name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Typecheck, test and build web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The tape core is Rust compiled to wasm, and the npm scripts build it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci
      - run: npm run core:test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist

  # The desktop app, on the three platforms it ships on. `cargo test` includes the
  # headless UI frames and the menu table checked against src/state/commands.ts,
  # so a drift between the two builds fails here rather than at a tag.
  desktop:
    name: Build and test the desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
      - run: cargo fmt --check
        working-directory: desktop
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop
      - run: cargo test
        working-directory: desktop
